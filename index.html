<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sidereal Year Clock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main-content-wrapper">
    <div class="clock-container">
      <div class="clock-face-wrapper">
        <svg class="clock-face" viewBox="-25 -25 250 250">
          <!-- Spaced, Thicker 24-Hour Environmental Ring Timelines -->
          <circle id="solar-horizon-track" cx="100" cy="100" r="112" fill="none" stroke="#1E293B" stroke-width="4" />
          <circle id="work-window-track" cx="100" cy="100" r="104" fill="none" stroke="#1E293B" stroke-width="4" />

          <!-- Outer Boundary Ring -->
          <circle cx="100" cy="100" r="96" fill="none" stroke="#374151" stroke-width="2" />
          
          <!-- Hour Notches Inner Ring Ring -->
          <circle cx="100" cy="100" r="38" fill="none" stroke="#374151" stroke-width="1.5" />
          
          <!-- Notches and Fixed Labels Groups -->
          <g id="nares-notches"></g> 
          <g id="nares-labels"></g>
          <g id="dins-notches"></g>
          <g id="secs-notches"></g>
          <g id="secs-labels"></g>
          
          <!-- Hands -->
          <line id="nares-hand" class="hand hand-nares" x1="100" y1="100" x2="100" y2="68" /> 
          <line id="dins-hand" class="hand hand-dins" x1="100" y1="100" x2="100" y2="50" />
          <line id="secs-hand" class="hand hand-secs" x1="100" y1="100" x2="100" y2="10" />
          
          <!-- Static Top 00 Anchor Point Index Marker -->
          <line id="top-marker" x1="100" y1="-20" x2="100" y2="-3" stroke="#F87171" stroke-width="2.5" />

          <circle cx="100" cy="100" r="4" class="center-dot" />
          
          <!-- Dynamic Floating Value at Minute Hand Tip -->
          <text id="din-display-text" x="0" y="0">0</text>
        </svg>
      </div>

      <div id="pings-display">0</div>
      <div class="info-row">
        <div id="rotation-display">Α I 1</div>
        <div id="year-display">Year 0</div>
        <a href="https://jerichoart.github.io/SiderealCalendar/" target="_blank" class="calendar-link">
          <div id="favicon-box">
            <img src="icon for calendar.png" alt="calendar icon" class="calendar-icon">
          </div>
        </a>
      </div>
    </div>

    <!-- Structure Setup -->
    <div class="legend-container">
      <h2>Time Unit Structure</h2>
      <div class="legend-item"><div class="legend-color-box bg-year"></div><span>1 Year =</span><span class="value">4 Seasons</span></div>
      <div class="legend-item"><div class="legend-color-box bg-season"></div><span>1 Season =</span><span class="value">5 Months</span></div>
      <div class="legend-item"><div class="legend-color-box bg-month"></div><span>1 Month =</span><span class="value">50 Days</span></div>
      <div class="legend-item"><div class="legend-color-box bg-day"></div><span>1 Day =</span><span class="value">10 Hours</span></div> 
      <div class="legend-item"><div class="legend-color-box bg-green"></div><span>1 Hour =</span><span class="value">50 Mins</span></div> 
      <div class="legend-item"><div class="legend-color-box bg-blue"></div><span>1 Min =</span><span class="value">10 Secs</span></div>
      <div class="legend-item"><div class="legend-color-box bg-red"></div><span>1 Sec =</span><span class="value">10 Pings</span></div>

      <div class="legend-divider"></div>

      <h2>Unit Lengths</h2>
      <div class="legend-item"><div class="legend-color-box bg-pings"></div><span>1 Ping</span><span class="value" id="ping-length"></span></div>
      <div class="legend-item"><div class="legend-color-box bg-red"></div><span>1 Sec</span><span class="value" id="sec-length"></span></div>
      <div class="legend-item"><div class="legend-color-box bg-blue"></div><span>1 Min</span><span class="value" id="din-length"></span></div>
      <div class="legend-item"><div class="legend-color-box bg-green"></div><span>1 Hour</span></span><span id="nare-length"></span></div> 
	  
	  <!-- New Real-World Environmental Legend Additions -->
      <div class="legend-item"><div class="legend-color-box bg-daylight shadow-glow-yellow"></div><span>Local Daylight</span><span class="value">24h Dial</span></div>
      <div class="legend-item"><div class="legend-color-box bg-workwindow shadow-glow-green"></div><span>9-5 Work Window</span><span class="value">24h Dial</span></div>
	  
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
